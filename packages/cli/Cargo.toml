[package]
name = "webmarks"
version = "0.1.0"
edition = "2021"
description = "CLI for the webmarks bookmarking API"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
dirs = "6"
rpassword = "7"
thiserror = "2"

[dev-dependencies]

[[bin]]
name = "webmarks"
path = "src/main.rs"
