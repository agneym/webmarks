name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format, lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # wrangler and @cloudflare/vitest-pool-workers (workerd) run on Node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (oxfmt)
        run: pnpm run fmt:check

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Type check (tsc)
        working-directory: packages/backend
        run: pnpm run type:check

      # remoteBindings: false in vitest.config.ts keeps the workers pool fully
      # local, so no Cloudflare credentials are needed.
      - name: Test (vitest + workers pool)
        working-directory: packages/backend
        run: pnpm run test

  cli:
    name: CLI (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cli

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
